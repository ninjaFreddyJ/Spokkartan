name: Apply DB migration (platser → live)

# AUTOMATISK databas-synk.
# Körs av sig själv vid varje push till main som ändrar något i sql/ —
# dvs varje gång Claude lägger till nya platser blir de live automatiskt.
# Kan även köras manuellt (workflow_dispatch).
#
# ENDA engångsåtgärden: lägg secret SUPABASE_DB_URL en gång
# (Repo → Settings → Secrets and variables → Actions). Sedan: helt automatiskt.

on:
  push:
    branches: [ main ]
    paths:
      - 'sql/**'
  workflow_dispatch: {}

concurrency:
  group: apply-db
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migration against Supabase
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Saknar secret SUPABASE_DB_URL. Lägg till den EN gång i Settings -> Secrets and variables -> Actions, sedan är allt automatiskt."
            exit 1
          fi
          echo "Synkar platser till Supabase ..."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f sql/00_RUN_THIS_IN_SUPABASE.sql
          echo "Klart — alla platser är live."
