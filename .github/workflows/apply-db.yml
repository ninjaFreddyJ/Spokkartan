name: Apply DB migration (platser → live)

# Kör SQL-paketet mot Supabase från en GitHub-runner (som NÅR Supabase,
# till skillnad från Claudes sandlåda). Behöver ETT repo-secret: SUPABASE_DB_URL
# (Supabase → Project Settings → Database → Connection string → URI).
#
# Lägg till secret:  Repo → Settings → Secrets and variables → Actions →
#                    New repository secret → Name: SUPABASE_DB_URL → klistra in URI:n.
# Sedan: Actions-fliken → "Apply DB migration" → Run workflow  (eller be Claude trigga).

on:
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migration against Supabase
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Saknar secret SUPABASE_DB_URL. Lägg till den i Settings -> Secrets and variables -> Actions, kör sedan igen."
            exit 1
          fi
          echo "Kör 00_RUN_THIS_IN_SUPABASE.sql ..."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f sql/00_RUN_THIS_IN_SUPABASE.sql
          echo "Klart."
