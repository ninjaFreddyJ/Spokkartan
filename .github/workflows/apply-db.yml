name: Apply DB migration (platser → live)

# Automatisk databas-synk.
# - Körs vid varje push till main som ändrar något i sql/
# - Kan köras manuellt (workflow_dispatch)
# Alla numrerade SQL-filer har ON CONFLICT -> idempotenta, säkert att köra om.
# Engångs-secret: SUPABASE_DB_URL (Settings -> Secrets and variables -> Actions).

on:
  push:
    branches: [main]
    paths:
      - 'sql/**'
  workflow_dispatch: {}

concurrency:
  group: apply-db
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run all SQL migrations in order
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Saknar secret SUPABASE_DB_URL. Lagg till den en gang i Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          FILES=$(find sql -name '[0-9][0-9]_*.sql' ! -name '00_*' | sort)
          if [ -z "$FILES" ]; then echo "Inga SQL-filer hittades."; exit 0; fi
          echo "=== Kor foljande filer i ordning ==="
          echo "$FILES"
          echo "---"
          for f in $FILES; do
            echo ">>> $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "<<< $f klar"
          done
          echo "=== Alla migrationer klara - platser ar live ==="
